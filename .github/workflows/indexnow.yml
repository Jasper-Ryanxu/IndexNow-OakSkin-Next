      - name: 提交至 Bing Webmaster API
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          SITE_URL="https://skin.oak-ms.top"
          URL_JSON='${{ steps.read-urls.outputs.url_json }}'
          TOTAL=$(echo "$URL_JSON" | jq 'length')
          echo "📤 [Bing] 共 $TOTAL 个 URL 待提交"

          # Bing 默认每天每站配额 100，BATCH_SIZE 与 MAX_SUBMIT 都不能超过它
          BATCH_SIZE=100
          MAX_SUBMIT=100

          if [ "$TOTAL" -gt "$MAX_SUBMIT" ]; then
            echo "⚠️ [Bing] 今日配额上限 $MAX_SUBMIT，本次仅提交前 $MAX_SUBMIT 个 URL（其余由 IndexNow 覆盖）"
            URL_JSON=$(echo "$URL_JSON" | jq -c ".[0:$MAX_SUBMIT]")
            TOTAL=$MAX_SUBMIT
          fi

          i=0
          while [ "$i" -lt "$TOTAL" ]; do
            END=$((i + BATCH_SIZE))
            [ "$END" -gt "$TOTAL" ] && END=$TOTAL
            BATCH=$(echo "$URL_JSON" | jq -c ".[$i:$END]")
            echo "➡️ [Bing] 提交第 $((i+1)) ~ $END 个"

            BING_BODY=$(jq -n \
              --arg siteUrl "$SITE_URL" \
              --argjson urlList "$BATCH" \
              '{siteUrl:$siteUrl, urlList:$urlList}')

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://ssl.bing.com/webmaster/api.svc/json/SubmitUrlbatch?apikey=${BING_API_KEY}" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$BING_BODY")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            echo "📬 [Bing] HTTP：$HTTP_CODE"
            echo "📬 [Bing] 响应：$BODY"

            # 配额超限：跳过剩余批次，不视为失败（IndexNow 已完成 Bing 同步）
            if [ "$HTTP_CODE" = "400" ] && echo "$BODY" | grep -qi "quota"; then
              echo "⚠️ [Bing] 配额已用尽，跳过剩余批次"
              break
            fi

            if [ "$HTTP_CODE" != "200" ]; then
              echo "⚠️ [Bing] 非预期状态码：$HTTP_CODE"
              exit 1
            fi

            i=$((i + BATCH_SIZE))
          done

          echo "✅ [Bing] 处理完成"
